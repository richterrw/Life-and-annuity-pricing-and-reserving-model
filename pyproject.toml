[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lamodel"
version = "1.0.0"
description = "Life and annuity pricing, cash-flow projection, statutory and stochastic reserving using SOA mortality tables"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Robbie Richter" }]
dependencies = ["numpy>=1.26", "pandas>=2.1", "matplotlib>=3.8", "openpyxl>=3.1", "tabulate>=0.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.16.9", "nbclient>=0.10", "nbformat>=5.10", "ipykernel>=6.29"]

[tool.setuptools]
packages = ["lamodel"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
ignore = ["E731", "E702", "B023", "B905"]

[tool.ruff.lint.per-file-ignores]
"run_model.py" = ["E501"]  # markdown table rows
"notebooks/*" = ["E501"]  # notebook source held in strings
